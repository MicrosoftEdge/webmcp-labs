name: WebMCP Agent

on:
  pull_request:
    paths:
      - "webmcp-agent/**"
      - ".github/workflows/webmcp-agent.yml"
  push:
    branches: [main]
    paths:
      - "webmcp-agent/**"
      - ".github/workflows/webmcp-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: webmcp-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmcp-agent/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
  ui:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webmcp-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmcp-agent/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: UI interactions and visual regressions
        run: npm run test:ui
      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webmcp-agent-ui-failure
          path: |
            webmcp-agent/playwright-report/
            webmcp-agent/test-results/
          retention-days: 7
