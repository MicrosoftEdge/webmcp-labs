name: WebMCP Agent

on:
  pull_request:
    paths:
      - "webmcp-agent/**"
      - ".github/workflows/webmcp-agent.yml"
  push:
    branches: [main]
    paths:
      - "webmcp-agent/**"
      - ".github/workflows/webmcp-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: webmcp-agent
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmcp-agent/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
  ui:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webmcp-agent
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webmcp-agent/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: UI interactions and visual regressions
        run: npm run test:ui
      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webmcp-agent-ui-failure
          path: |
            webmcp-agent/playwright-report/
            webmcp-agent/test-results/
          retention-days: 7
